sonar.projectKey=cartograph
sonar.projectName=cartograph
# Keep this equal to Cargo.toml [workspace.package].version. The required
# release-workflow contract fails closed when they differ.
sonar.projectVersion=2.1.33
sonar.sourceEncoding=UTF-8

# Rust production and integration-test trees share crate roots. The mutually
# exclusive patterns keep every file classified exactly once.
sonar.sources=crates
sonar.tests=crates
sonar.test.inclusions=crates/**/tests/**/*.rs,crates/**/benches/**/*.rs
sonar.exclusions=crates/**/tests/**/*.rs,crates/**/tests/fixtures/**,crates/**/benches/**/*.rs

# Generated compiler/coverage state and disposable local services are never
# first-party source inputs.
sonar.coverage.exclusions=crates/**/tests/**/*.rs,crates/**/tests/fixtures/**,crates/**/benches/**/*.rs
sonar.rust.lcov.reportPaths=target/llvm-cov/lcov.info

# The repository owns the exact strict Clippy command. Importing its report
# prevents the server plugin from replacing it with a narrower, version-stale
# command-line lint list. SonarQube 26.6 reads the `enabled` spelling while its
# current documentation still publishes `enable`, so keep both fail-closed
# switches until the server and documentation converge.
sonar.rust.clippy.enable=false
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=target/sonar/clippy.json
