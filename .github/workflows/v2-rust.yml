name: v2 Rust

on:
  workflow_dispatch:
  push:
    # Tag pushes are owned by release.yml, which verifies this workflow's exact-SHA
    # main attestation instead of rerunning the complete live suite. Feature
    # branches are covered by pull_request below, avoiding duplicate PR gates.
    # Required checks must not use path filters: GitHub leaves a path-filtered
    # required workflow pending. The classify job selects the lightweight docs
    # contract or the complete release gate instead.
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: v2-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select fail-closed validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          force_full() {
            printf '%s\n' 'full=true' 'docs_only=false' >>"$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              force_full
              exit 0
              ;;
            push)
              base="$PUSH_BASE_SHA"
              head="$EVENT_SHA"
              diff_range="$base..$head"
              ;;
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              diff_range="$base...$head"
              ;;
            *)
              force_full
              exit 0
              ;;
          esac

          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0+$ ||
                ! "$head" =~ ^[0-9a-f]{40}$ ||
                "$(git cat-file -t "$base" 2>/dev/null || true)" != commit ||
                "$(git cat-file -t "$head" 2>/dev/null || true)" != commit ]]; then
            force_full
            exit 0
          fi

          git diff --no-renames --name-only -z "$diff_range" |
            scripts/classify-v2-ci-change.sh >>"$GITHUB_OUTPUT"

  quality:
    name: format + clippy + rustdoc + unit + PostgreSQL-only
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require successful change classification
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_GATE: ${{ needs.classify.outputs.full }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]]
          if [[ "$FULL_GATE" == true ]]; then
            [[ "$DOCS_ONLY" == false ]]
          else
            [[ "$FULL_GATE" == false && "$DOCS_ONLY" == true ]]
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust dependency cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cartograph-rust-${{ runner.os }}-v2-ubuntu-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cartograph-rust-${{ runner.os }}-v2-ubuntu-

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Workspace dependency contract
        if: needs.classify.outputs.full == 'true'
        run: scripts/test-workspace-dependencies.sh

      - name: Release workflow contract
        run: scripts/test-rust-release-workflow.sh

      - name: Documentation contract
        if: needs.classify.outputs.docs_only == 'true'
        run: >-
          cargo test --locked -p cartograph-cli --bin cartograph
          tests::documentation_contract:: -- --nocapture

      - name: Formatting
        if: needs.classify.outputs.full == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: needs.classify.outputs.full == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Strict public API documentation
        if: needs.classify.outputs.full == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Unit tests
        if: needs.classify.outputs.full == 'true'
        run: cargo test --locked --workspace --all-features

      - name: Dependency advisories, licenses, bans, and sources
        if: needs.classify.outputs.full == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.98.1'
          command: check
          arguments: --all-features

      - name: Native dependency shape
        if: needs.classify.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked --workspace --all-features -e normal)"
          if grep -Eiq 'sqlite|libsqlite' <<<"$tree"; then
            echo 'Cartograph v2 must not contain a SQLite runtime dependency.' >&2
            grep -Ei 'sqlite|libsqlite' <<<"$tree" >&2
            exit 1
          fi
          if grep -Eq '^name = "(sqlx-sqlite|libsqlite3-sys|rusqlite)"$' Cargo.lock; then
            echo 'Cargo.lock contains a forbidden SQLite package.' >&2
            grep -E '^name = "(sqlx-sqlite|libsqlite3-sys|rusqlite)"$' Cargo.lock >&2
            exit 1
          fi
          if grep -Eq 'aws-lc-(rs|sys) v[0-9]' <<<"$tree"; then
            echo 'Cartograph must not compile the duplicate AWS-LC Rustls provider.' >&2
            grep -E 'aws-lc-(rs|sys) v[0-9]' <<<"$tree" >&2
            exit 1
          fi
          if ! grep -Eq 'ring v[0-9]' <<<"$tree"; then
            echo 'Cartograph requires ring as its single Rustls cryptography provider.' >&2
            exit 1
          fi
          echo 'Native dependency graph is PostgreSQL-only and standardized on ring.'

      - name: No SQLite runtime source
        if: needs.classify.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          matches="$(
            git grep -nI -E -i 'rusqlite|libsqlite|sqlx[-_:]?sqlite|bun:sqlite|sqlite3|sqlite://' -- \
              Cargo.toml \
              build.rs \
              ':(glob)crates/*/Cargo.toml' \
              ':(glob)crates/*/build.rs' \
              ':(glob)crates/*/src/**' \
              ':(glob)deploy/paradedb/**'
          )"
          grep_status=$?
          set -e
          if (( grep_status > 1 )); then
            echo "SQLite source scan failed with status $grep_status." >&2
            exit "$grep_status"
          fi
          unexpected=''
          while IFS=: read -r path line text; do
            if [[ -z "$path" ]]; then
              continue
            fi
            trimmed="${text#"${text%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"

            # This exact URL is test-only rejection coverage, never a runtime adapter.
            if [[ "$path" == 'crates/cartograph-config/src/lib.rs' ]]; then
              case "$trimmed" in
                'let input = "sqlite:///tmp/private-cartograph.db?password=should-not-leak";')
                  continue
                  ;;
              esac
            fi

            unexpected+="$path:$line:$text"$'\n'
          done <<<"$matches"

          if [[ -n "$unexpected" ]]; then
            echo 'Cartograph v2 contains forbidden SQLite runtime source:' >&2
            printf '%s' "$unexpected" >&2
            exit 1
          fi
          echo 'No SQLite runtime source found.'

      - name: No executable TypeScript, Bun, Node, or browser-viewer runtime
        if: needs.classify.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$({
            git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.mts' '*.cts' '*.mjs' '*.cjs'
          } | grep -Ev '^(crates/cartograph-indexer/tests/fixtures/native_corpus_v1/|crates/cartograph-extract/tests/fixtures/v1_1_33/|docs/test-beds/)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Cartograph v2 contains executable legacy runtime source outside frozen fixtures:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for legacy in package.json package-lock.json bun.lock bunfig.toml tsconfig.json biome.json; do
            if git ls-files --error-unmatch "$legacy" >/dev/null 2>&1; then
              echo "Cartograph v2 still tracks legacy runtime manifest $legacy" >&2
              exit 1
            fi
          done
          if git ls-files 'src/**' '__tests__/**' 'bench/**' | grep -q .; then
            echo 'Cartograph v2 still tracks the executable v1 source/test/bench tree.' >&2
            git ls-files 'src/**' '__tests__/**' 'bench/**' >&2
            exit 1
          fi
          echo 'No executable TypeScript/Bun/Node/browser-viewer runtime found.'

      - name: Save Rust dependency cache
        if: >-
          needs.classify.outputs.full == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  windows-portability:
    name: Windows strict compile portability
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust dependency cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cartograph-rust-${{ runner.os }}-v2-windows-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cartograph-rust-${{ runner.os }}-v2-windows-

      - name: Windows release path privacy regression
        shell: pwsh
        run: scripts/test-windows-rust-release-paths.ps1

      - name: Windows all-target, all-feature Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Save Rust dependency cache
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  macos-portability:
    name: macOS strict compile portability
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust dependency cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cartograph-rust-${{ runner.os }}-v2-macos-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cartograph-rust-${{ runner.os }}-v2-macos-

      - name: macOS all-target, all-feature Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Save Rust dependency cache
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  linux-release-portability:
    name: Linux x64 Debian 13 current stable
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, audit, and smoke on glibc 2.41
        shell: bash
        run: >-
          scripts/build-linux-rust-release.sh
          x86_64-unknown-linux-gnu
          linux-x64
          rust:1.98.0-trixie@sha256:8aea3a845c48caac4091a8d0e6494d213061f8f014dc2f5a5f1a88a1a8c9f301
          debian:13-slim@sha256:abc9cb88a5587630d7f915f47b23b0668fe250fbfc6457aa4d52b534c1bbf73f

  paradedb:
    name: PostgreSQL 18 + ParadeDB + pgvector (${{ matrix.shard }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        shard:
          - database
          - runtime
          - operations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARTOGRAPH_POSTGRES_PASSWORD: cartograph-v2-ci-only
      CARTOGRAPH_DATABASE_URL: postgresql://cartograph:cartograph-v2-ci-only@127.0.0.1:55432/cartograph
      CARTOGRAPH_TEST_DATABASE_URL: postgresql://cartograph:cartograph-v2-ci-only@127.0.0.1:55432/cartograph
      CARTOGRAPH_PARADEDB_IMAGE: paradedb/paradedb:0.25.7@sha256:e4e80f2408e556e84b62d18cda7f6bdd690f2939e109e1b132b49e934193f4ed
    steps:
      - name: Documentation-only required-check fast path
        if: needs.classify.outputs.docs_only == 'true'
        run: echo 'Live PostgreSQL validation is not required for documentation-only changes.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.full == 'true'

      - name: Resolve pinned Rust toolchain
        if: needs.classify.outputs.full == 'true'
        run: rustup show active-toolchain

      - name: Restore Rust dependency cache
        if: needs.classify.outputs.full == 'true'
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cartograph-rust-${{ runner.os }}-v2-ubuntu-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cartograph-rust-${{ runner.os }}-v2-ubuntu-

      - name: Pull pinned ParadeDB image with bounded retries
        if: needs.classify.outputs.full == 'true'
        run: scripts/pull-pinned-image.sh "$CARTOGRAPH_PARADEDB_IMAGE"

      - name: Start pinned ParadeDB service on loopback
        if: needs.classify.outputs.full == 'true'
        id: start_paradedb
        run: >-
          docker run --detach --pull never
          --name cartograph-v2-ci-postgres
          --env POSTGRES_USER=cartograph
          --env POSTGRES_PASSWORD="$CARTOGRAPH_POSTGRES_PASSWORD"
          --env POSTGRES_DB=cartograph
          --publish 127.0.0.1:55432:5432
          --shm-size 268435456
          --memory 2147483648
          --memory-reservation 1073741824
          --cpus 4
          --pids-limit 256
          --health-cmd 'pg_isready -U cartograph -d cartograph'
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          "$CARTOGRAPH_PARADEDB_IMAGE"
          postgres
          -c shared_buffers=256MB
          -c effective_cache_size=1GB
          -c maintenance_work_mem=128MB
          -c autovacuum_work_mem=64MB
          -c work_mem=4MB
          -c checkpoint_timeout=15min
          -c max_wal_size=4GB
          -c min_wal_size=512MB
          -c max_connections=96
          -c max_worker_processes=16
          -c max_parallel_workers=4
          -c max_parallel_maintenance_workers=2

      - name: Wait for completed PostgreSQL bootstrap and health
        if: needs.classify.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            state="$(docker inspect --format '{{.State.Status}}' cartograph-v2-ci-postgres)"
            if [[ "$state" != running ]]; then
              docker logs --tail 200 cartograph-v2-ci-postgres >&2
              echo "ParadeDB container stopped during bootstrap: $state" >&2
              exit 1
            fi
            status="$(docker inspect --format '{{.State.Health.Status}}' cartograph-v2-ci-postgres)"
            if docker logs cartograph-v2-ci-postgres 2>&1 \
                | grep -Fq 'PostgreSQL init process complete; ready for start up.' \
              && [[ "$status" == healthy ]] \
              && docker exec cartograph-v2-ci-postgres \
                psql --username cartograph --dbname cartograph \
                  --set ON_ERROR_STOP=1 --tuples-only \
                  --command 'SELECT 1;' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 200 cartograph-v2-ci-postgres >&2
          echo 'Timed out waiting for completed ParadeDB bootstrap and health.' >&2
          exit 1

      - name: Initialize required extensions
        if: needs.classify.outputs.full == 'true'
        run: >-
          docker exec cartograph-v2-ci-postgres
          psql --username cartograph --dbname cartograph --set ON_ERROR_STOP=1
          --command 'CREATE EXTENSION IF NOT EXISTS vector;'
          --command 'CREATE EXTENSION IF NOT EXISTS pg_search;'

      - name: Capture clean schema baseline
        if: needs.classify.outputs.full == 'true'
        id: schema_baseline
        shell: bash
        run: |
          set -euo pipefail
          docker exec cartograph-v2-ci-postgres \
            psql --username cartograph --dbname cartograph \
              --set ON_ERROR_STOP=1 --tuples-only --no-align \
              --command "SELECT nspname FROM pg_catalog.pg_namespace ORDER BY nspname" \
            > /tmp/cartograph-schema-baseline.txt
          test -s /tmp/cartograph-schema-baseline.txt

      - name: Verify loopback-only publication
        if: needs.classify.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          published="$(docker port cartograph-v2-ci-postgres 5432/tcp)"
          if [[ "$published" != '127.0.0.1:55432' ]]; then
            echo "Expected loopback-only PostgreSQL, got: $published" >&2
            exit 1
          fi

      - name: Rust database doctor
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: |
          cargo run --locked --quiet -p cartograph-cli -- doctor
          cargo run --locked --quiet -p cartograph-cli -- doctor --format json

      - name: Live capability integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_capabilities -- --ignored --nocapture

      - name: Generation-safe schema and BM25 integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_generation -- --ignored --nocapture

      - name: Storage observability, retention, and online compaction integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_storage_lifecycle -- --ignored --nocapture

      - name: COPY ingestion and deterministic digest integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_ingest -- --ignored --nocapture

      - name: Project operation lease integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_leases -- --ignored --nocapture

      - name: Semantic model, pgvector, HNSW, readiness, and retention integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_semantic -- --include-ignored --nocapture --test-threads=1

      - name: V1 PostgreSQL import, rollback, resume, and retention integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_v1_import_retention -- --ignored --nocapture --test-threads=1

      - name: Project purge fencing and physical-relation cleanup integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_project_purge -- --ignored --nocapture --test-threads=1

      - name: Lease-owned indexer supervisor integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'runtime'
        run: >-
          cargo test --locked --quiet -p cartograph-indexer
          --test live_supervisor -- --ignored --nocapture --test-threads=1

      - name: Agent runtime index, hybrid retrieval, no-op, freshness, and review integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'runtime'
        run: >-
          cargo test --locked --quiet -p cartograph-agent
          --test live_project -- --ignored --nocapture --test-threads=1

      - name: Candidate binary self-indexes this repository
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'operations'
        env:
          CARTOGRAPH_DATABASE_SCHEMA: cartograph_ci_self_index
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p cartograph-cli -- \
            index "$GITHUB_WORKSPACE" --workers 4 --format json >/tmp/cartograph-self-index.json
          jq -e 'type == "object"' /tmp/cartograph-self-index.json >/dev/null
          cargo run --locked --quiet -p cartograph-cli -- \
            status "$GITHUB_WORKSPACE" --format json >/tmp/cartograph-self-status.json
          jq -e '.project.fresh == true and .project.snapshot.current != null' \
            /tmp/cartograph-self-status.json >/dev/null
          cargo run --locked --quiet -p cartograph-cli -- \
            context 'locate the structural status query path' \
            --project-path "$GITHUB_WORKSPACE" --format json \
            >/tmp/cartograph-self-context.json
          jq -e '
            .freshness == "current"
            and .evidence.packet.abstention == null
            and (.evidence.packet.evidence | type == "array")
            and (.evidence.packet.evidence | length) > 0
          ' \
            /tmp/cartograph-self-context.json >/dev/null

      - name: Native CLI/MCP summary, role, graph, history, session, and watcher integration tests
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'runtime'
        run: >-
          cargo test --locked --quiet -p cartograph-cli
          -- --ignored --nocapture --test-threads=1

      - name: Locked native patch-task evaluation and repeatability gate
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'runtime'
        run: >-
          cargo test --locked --quiet -p cartograph-agent
          --test patch_task_evaluation -- --include-ignored --nocapture --test-threads=1

      - name: Frozen 1/2/4/8/16-worker determinism and scaling benchmark
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'operations'
        run: cargo bench --locked -p cartograph-indexer --bench index_scaling

      - name: Managed database lifecycle integration test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'operations'
        run: >-
          cargo test --locked --quiet -p cartograph-db --lib
          managed::tests:: -- --ignored --nocapture --test-threads=1

      - name: Managed backup, restore, upgrade, rollback, and derived-index test
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'operations'
        run: >-
          cargo test --locked --quiet -p cartograph-db --lib
          managed::maintenance::tests:: -- --ignored --nocapture --test-threads=1

      - name: Remove named self-index fixture schema
        if: >-
          always() && needs.classify.outputs.full == 'true' &&
          matrix.shard == 'operations' && steps.start_paradedb.outcome == 'success'
        run: >-
          docker exec cartograph-v2-ci-postgres
          psql --username cartograph --dbname cartograph --set ON_ERROR_STOP=1
          --command 'DROP SCHEMA IF EXISTS cartograph_ci_self_index CASCADE;'

      - name: Assert live tests left zero PostgreSQL schemas
        if: >-
          always() && needs.classify.outputs.full == 'true' &&
          steps.schema_baseline.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          docker exec cartograph-v2-ci-postgres \
            psql --username cartograph --dbname cartograph \
              --set ON_ERROR_STOP=1 --tuples-only --no-align \
              --command "SELECT nspname FROM pg_catalog.pg_namespace ORDER BY nspname" \
            > /tmp/cartograph-schema-final.txt
          if ! diff -u /tmp/cartograph-schema-baseline.txt /tmp/cartograph-schema-final.txt; then
            echo 'Live tests leaked PostgreSQL schemas; panic-safe cleanup is a release gate.' >&2
            exit 1
          fi

      - name: ParadeDB logs on failure
        if: needs.classify.outputs.full == 'true' && failure()
        shell: bash
        run: |
          if docker inspect cartograph-v2-ci-postgres >/dev/null 2>&1; then
            docker logs --tail 200 cartograph-v2-ci-postgres
          fi

      - name: Stop ParadeDB service
        if: always() && needs.classify.outputs.full == 'true'
        run: docker rm --force --volumes cartograph-v2-ci-postgres 2>/dev/null || true

  attest-main-gate:
    name: Attest exact-SHA green main gate
    if: >-
      needs.classify.outputs.full == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - classify
      - quality
      - windows-portability
      - macos-portability
      - linux-release-portability
      - paradedb
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Write exact-SHA gate manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-attestation
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schemaVersion: 1,
              repository: $repository,
              sha: $sha,
              ref: $ref,
              workflowRef: $workflowRef,
              eventName: $eventName,
              runId: $runId,
              runAttempt: $runAttempt,
              requiredJobs: [
                "quality",
                "windows-portability",
                "macos-portability",
                "linux-release-portability",
                "paradedb/database",
                "paradedb/runtime",
                "paradedb/operations"
              ]
            }' >gate-attestation/v2-main-gate.json
          jq -e \
            '.ref == "refs/heads/main" and (.sha | test("^[0-9a-f]{40}$"))' \
            gate-attestation/v2-main-gate.json >/dev/null

      - name: Attest exact-SHA gate manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: gate-attestation/v2-main-gate.json

      - name: Upload exact-SHA gate manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v2-main-gate-${{ github.sha }}
          path: gate-attestation/v2-main-gate.json
          if-no-files-found: error
          retention-days: 90
