[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Apply maintenance advisories to direct and transitive dependencies alike.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "deny"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = [
  { crate = "aws-lc-rs", reason = "Cartograph standardizes Rustls on ring to avoid duplicate crypto providers" },
  { crate = "aws-lc-sys", reason = "Cartograph standardizes Rustls on ring to avoid duplicate crypto providers" },
  { crate = "libsqlite3-sys", reason = "Cartograph v2 is PostgreSQL-only" },
  { crate = "rusqlite", reason = "Cartograph v2 is PostgreSQL-only" },
  { crate = "sqlx-sqlite", reason = "Cartograph v2 is PostgreSQL-only" },
]
skip = [
  { crate = "base64@0.22.1", reason = "SQLx 0.9 and hyper-util still require base64 0.22; reqwest 0.13.5 now requires 0.23" },
  { crate = "tree-sitter@0.26.13", reason = "Local ABAP compatibility facade reexports 0.27 types and has no native code; the workspace gate verifies exactly one 0.27 runtime" },
  { crate = "getrandom@0.2.17", reason = "ring/rustls has not yet adopted getrandom 0.4" },
  { crate = "hashbrown@0.16.1", reason = "sqlx hashlink and serde indexmap currently require adjacent releases" },
  { crate = "syn@2.0.119", reason = "Tokio and ICU derive macros have not yet adopted syn 3" },
  { crate = "windows-sys@0.60.2", reason = "notify 8.2.0 has not yet adopted the workspace's windows-sys 0.61 line" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
