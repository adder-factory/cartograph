services:
  postgres:
    # Cartograph does not redistribute ParadeDB. Development pulls the pinned
    # upstream multi-architecture image so runtime and extension upgrades are explicit.
    image: paradedb/paradedb:0.25.6@sha256:c5b04eba22497fa25de12265692e9578e309c2e2001d023ce6d08a17226c200a
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 4.0
    pids_limit: 256
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=512MB
      - -c
      - max_connections=96
      - -c
      - max_worker_processes=16
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_maintenance_workers=2
    environment:
      POSTGRES_USER: ${CARTOGRAPH_POSTGRES_USER:-cartograph}
      POSTGRES_PASSWORD: "${CARTOGRAPH_POSTGRES_PASSWORD:?set CARTOGRAPH_POSTGRES_PASSWORD}"
      POSTGRES_DB: ${CARTOGRAPH_POSTGRES_DB:-cartograph}
    ports:
      # 55432 intentionally coexists with a v1 PostgreSQL instance commonly
      # bound on 5433 during side-by-side migration and parity testing.
      # Loopback is mandatory: PostgreSQL must not be exposed to the LAN.
      - "127.0.0.1:${CARTOGRAPH_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
