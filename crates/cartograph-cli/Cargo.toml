[package]
name = "cartograph-cli"
publish = false
description = "Rust CLI and MCP entry point for Cartograph v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cartograph"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
cartograph-agent.workspace = true
cartograph-config.workspace = true
cartograph-db.workspace = true
cartograph-domain.workspace = true
cartograph-llm.workspace = true
cartograph-mcp.workspace = true
cartograph-search.workspace = true
clap.workspace = true
notify.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
reqwest.workspace = true
sha2.workspace = true
futures-util.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
toml_edit.workspace = true
url.workspace = true

[lints]
workspace = true

[dev-dependencies]
cartograph-test-support.workspace = true
sqlx-core.workspace = true
tokio = { workspace = true, features = ["test-util"] }
