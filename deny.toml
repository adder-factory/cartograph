[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Apply maintenance advisories to direct and transitive dependencies alike.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "deny"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = [
  { crate = "sqlx", reason = "The PostgreSQL runtime was retired in the native storage cutover" },
  { crate = "sqlx-core", reason = "The PostgreSQL runtime was retired in the native storage cutover" },
  { crate = "sqlx-postgres", reason = "The PostgreSQL runtime was retired in the native storage cutover" },
  { crate = "tokio-postgres", reason = "Cartograph has one native RocksDB storage backend" },
  { crate = "postgres", reason = "Cartograph has one native RocksDB storage backend" },
  { crate = "aws-lc-rs", reason = "Cartograph standardizes Rustls on ring to avoid duplicate crypto providers" },
  { crate = "aws-lc-sys", reason = "Cartograph standardizes Rustls on ring to avoid duplicate crypto providers" },
  { crate = "libsqlite3-sys", reason = "Cartograph uses only the native RocksDB runtime" },
  { crate = "rusqlite", reason = "Cartograph uses only the native RocksDB runtime" },
  { crate = "sqlx-sqlite", reason = "Cartograph uses only the native RocksDB runtime" },
]
skip = [
  { crate = "tree-sitter@0.26.13", reason = "Local ABAP compatibility facade reexports 0.27 types and has no native code; the workspace gate verifies exactly one 0.27 runtime" },
  { crate = "getrandom@0.2.17", reason = "ring/rustls has not yet adopted getrandom 0.4" },
  { crate = "windows-sys@0.60.2", reason = "notify 8.2.0 has not yet adopted the workspace's windows-sys 0.61 line" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Immutable Cargo pin includes the upstream bindgen 0.73 update; no version ban
# is bypassed. Return to crates.io after that update is published.
allow-git = ["https://github.com/zaidoon1/rust-rocksdb"]
