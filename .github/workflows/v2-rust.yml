name: v2 Rust

on:
  workflow_dispatch:
  push:
    # Tag pushes are owned by release.yml, which verifies this workflow's exact-SHA
    # main attestation instead of rerunning the complete live suite. Feature
    # branches are covered by pull_request below, avoiding duplicate PR gates.
    # Required checks must not use path filters: GitHub leaves a path-filtered
    # required workflow pending. The classify job selects the lightweight docs
    # contract or the complete release gate instead.
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: v2-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select fail-closed validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          force_full() {
            printf '%s\n' 'full=true' 'docs_only=false' >>"$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              force_full
              exit 0
              ;;
            push)
              base="$PUSH_BASE_SHA"
              head="$EVENT_SHA"
              diff_range="$base..$head"
              ;;
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              diff_range="$base...$head"
              ;;
            *)
              force_full
              exit 0
              ;;
          esac

          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0+$ ||
                ! "$head" =~ ^[0-9a-f]{40}$ ||
                "$(git cat-file -t "$base" 2>/dev/null || true)" != commit ||
                "$(git cat-file -t "$head" 2>/dev/null || true)" != commit ]]; then
            force_full
            exit 0
          fi

          git diff --no-renames --name-only -z "$diff_range" |
            scripts/classify-v2-ci-change.sh >>"$GITHUB_OUTPUT"

  quality:
    name: format + clippy + rustdoc + unit + RocksDB-only
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require successful change classification
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_GATE: ${{ needs.classify.outputs.full }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]]
          if [[ "$FULL_GATE" == true ]]; then
            [[ "$DOCS_ONLY" == false ]]
          else
            [[ "$FULL_GATE" == false && "$DOCS_ONLY" == true ]]
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust dependency cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cartograph-rust-${{ runner.os }}-v2-ubuntu-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cartograph-rust-${{ runner.os }}-v2-ubuntu-

      - name: Install native C++ binding prerequisites
        if: needs.classify.outputs.full == 'true'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Workspace dependency contract
        if: needs.classify.outputs.full == 'true'
        run: scripts/test-workspace-dependencies.sh

      - name: Release workflow contract
        run: scripts/test-rust-release-workflow.sh

      - name: Documentation contract
        if: needs.classify.outputs.docs_only == 'true'
        run: >-
          cargo test --locked -p cartograph-cli --bin cartograph
          tests::documentation_contract:: -- --nocapture

      - name: Formatting
        if: needs.classify.outputs.full == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: needs.classify.outputs.full == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Strict public API documentation
        if: needs.classify.outputs.full == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Unit tests
        if: needs.classify.outputs.full == 'true'
        run: cargo test --locked --workspace --all-features

      - name: Dependency advisories, licenses, bans, and sources
        if: needs.classify.outputs.full == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.99.0'
          command: check
          arguments: --all-features

      - name: Native dependency shape
        if: needs.classify.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked --workspace --all-features -e normal)"
          if grep -Eiq 'sqlite|libsqlite' <<<"$tree"; then
            echo 'Cartograph v2 must not contain a SQLite runtime dependency.' >&2
            grep -Ei 'sqlite|libsqlite' <<<"$tree" >&2
            exit 1
          fi
          if grep -Eq '^name = "(sqlx-sqlite|libsqlite3-sys|rusqlite)"$' Cargo.lock; then
            echo 'Cargo.lock contains a forbidden SQLite package.' >&2
            grep -E '^name = "(sqlx-sqlite|libsqlite3-sys|rusqlite)"$' Cargo.lock >&2
            exit 1
          fi
          if grep -Eq 'aws-lc-(rs|sys) v[0-9]' <<<"$tree"; then
            echo 'Cartograph must not compile the duplicate AWS-LC Rustls provider.' >&2
            grep -E 'aws-lc-(rs|sys) v[0-9]' <<<"$tree" >&2
            exit 1
          fi
          if ! grep -Eq 'ring v[0-9]' <<<"$tree"; then
            echo 'Cartograph requires ring as its single Rustls cryptography provider.' >&2
            exit 1
          fi
          if grep -Eq '(sqlx|tokio-postgres|postgres-protocol) v[0-9]' <<<"$tree"; then
            echo 'Native runtime must not contain PostgreSQL/SQLX dependencies.' >&2
            exit 1
          fi
          grep -Eq 'rust-rocksdb v0\.53\.0' <<<"$tree"
          echo 'Native dependency graph is RocksDB-only and standardized on ring.'

      - name: No SQLite runtime source
        if: needs.classify.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          matches="$(
            git grep -nI -E -i 'rusqlite|libsqlite|sqlx[-_:]?sqlite|bun:sqlite|sqlite3|sqlite://' -- \
              Cargo.toml \
              build.rs \
              ':(glob)crates/*/Cargo.toml' \
              ':(glob)crates/*/build.rs' \
              ':(glob)crates/*/src/**'
          )"
          grep_status=$?
          set -e
          if (( grep_status > 1 )); then
            echo "SQLite source scan failed with status $grep_status." >&2
            exit "$grep_status"
          fi
          unexpected=''
          while IFS=: read -r path line text; do
            if [[ -z "$path" ]]; then
              continue
            fi
            trimmed="${text#"${text%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"

            # This exact URL is test-only rejection coverage, never a runtime adapter.
            if [[ "$path" == 'crates/cartograph-config/src/lib.rs' ]]; then
              case "$trimmed" in
                'let input = "sqlite:///tmp/private-cartograph.db?password=should-not-leak";')
                  continue
                  ;;
              esac
            fi

            unexpected+="$path:$line:$text"$'\n'
          done <<<"$matches"

          if [[ -n "$unexpected" ]]; then
            echo 'Cartograph v2 contains forbidden SQLite runtime source:' >&2
            printf '%s' "$unexpected" >&2
            exit 1
          fi
          echo 'No SQLite runtime source found.'

      - name: No executable TypeScript, Bun, Node, or browser-viewer runtime
        if: needs.classify.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$({
            git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.mts' '*.cts' '*.mjs' '*.cjs'
          } | grep -Ev '^(crates/cartograph-indexer/tests/fixtures/native_corpus_v1/|crates/cartograph-extract/tests/fixtures/v1_1_33/|crates/cartograph-extract/tests/fixtures/v1_parity/|docs/test-beds/)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Cartograph v2 contains executable legacy runtime source outside frozen fixtures:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for legacy in package.json package-lock.json bun.lock bunfig.toml tsconfig.json biome.json; do
            if git ls-files --error-unmatch "$legacy" >/dev/null 2>&1; then
              echo "Cartograph v2 still tracks legacy runtime manifest $legacy" >&2
              exit 1
            fi
          done
          if git ls-files 'src/**' '__tests__/**' 'bench/**' | grep -q .; then
            echo 'Cartograph v2 still tracks the executable v1 source/test/bench tree.' >&2
            git ls-files 'src/**' '__tests__/**' 'bench/**' >&2
            exit 1
          fi
          echo 'No executable TypeScript/Bun/Node/browser-viewer runtime found.'

      - name: Save Rust dependency cache
        if: >-
          needs.classify.outputs.full == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  windows-portability:
    name: Windows strict compile portability
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust dependency cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cartograph-rust-${{ runner.os }}-v2-windows-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cartograph-rust-${{ runner.os }}-v2-windows-

      - name: Resolve native binding library
        shell: pwsh
        run: |
          $nativeClang = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (!(Test-Path (Join-Path $nativeClang 'libclang.dll'))) {
            throw 'RocksDB bindings require the runner LLVM libclang.dll'
          }
          "LIBCLANG_PATH=$nativeClang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Windows release path privacy regression
        shell: pwsh
        run: scripts/test-windows-rust-release-paths.ps1

      - name: Windows all-target, all-feature Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Save Rust dependency cache
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  macos-portability:
    name: macOS strict compile portability
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust dependency cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cartograph-rust-${{ runner.os }}-v2-macos-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cartograph-rust-${{ runner.os }}-v2-macos-

      - name: macOS all-target, all-feature Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Save Rust dependency cache
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  linux-release-portability:
    name: Linux x64 Debian 13 current stable
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, audit, and smoke on glibc 2.41
        shell: bash
        run: >-
          scripts/build-linux-rust-release.sh
          x86_64-unknown-linux-gnu
          linux-x64
          rust:1.99.0-trixie@sha256:d3ba1ad5d5b5a180ca8428b4fab8543a1b3933b32a8a7ad90a7ebbaf5497203a
          debian:13-slim@sha256:918311b7b6c4c6f68b232ba516584925f6c78ad82b6fd534b98979df6438e483

  rocksdb:
    name: RocksDB native (${{ matrix.shard }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        shard:
          - database
          - runtime
          - operations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Invalid legacy endpoints prove this suite has no SQL/Docker runtime.
      CARTOGRAPH_DATABASE_URL: postgresql://unused.invalid/cartograph
      DOCKER_HOST: unix:///nonexistent-cartograph-docker.sock
    steps:
      - name: Documentation-only required-check fast path
        if: needs.classify.outputs.docs_only == 'true'
        run: echo 'Native RocksDB validation is not required for documentation-only changes.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.full == 'true'

      - name: Resolve pinned Rust toolchain
        if: needs.classify.outputs.full == 'true'
        run: rustup show active-toolchain

      - name: Install native C++ binding prerequisites
        if: needs.classify.outputs.full == 'true'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Restore Rust dependency cache
        if: needs.classify.outputs.full == 'true'
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cartograph-rust-${{ runner.os }}-v2-ubuntu-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cartograph-rust-${{ runner.os }}-v2-ubuntu-

      - name: Native database transactions, snapshots, retention, and fault paths
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'database'
        run: |
          cargo test --locked --all-features -p cartograph-db --lib
          cargo test --locked --all-features -p cartograph-db --test rocks_state --test rocks_project --test rocks_graph -- --include-ignored --nocapture

      - name: Frozen native corpus worker matrix and supervisor faults
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'runtime'
        run: |
          cargo test --locked --all-features -p cartograph-indexer --test live_supervisor -- --include-ignored --nocapture
          cargo test --locked --all-features -p cartograph-agent --test live_project --test patch_task_evaluation -- --nocapture
          cargo bench --locked -p cartograph-indexer --bench index_scaling

      - name: Native owner IPC, CLI lifecycle, and process faults
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'operations'
        run: |
          cargo test --locked --all-features -p cartograph-cli --test rocks_cli --test rocks_owner --test live_cli_surface --test live_supervised_index --test index_startup -- --nocapture
          cargo test --locked --all-features -p cartograph-cli --test rocks_owner -- --ignored --nocapture --test-threads=1

      - name: Candidate self-index and current context evidence
        if: needs.classify.outputs.full == 'true' && matrix.shard == 'operations'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p cartograph-cli
          target/debug/cartograph index . --format json > "$RUNNER_TEMP/native-index.json"
          target/debug/cartograph doctor . --format json > "$RUNNER_TEMP/native-doctor.json"
          jq -e '.capabilitiesReady == true' "$RUNNER_TEMP/native-doctor.json"
          target/debug/cartograph context 'explain project runtime indexing and graph publication' --project-path . --format json > "$RUNNER_TEMP/native-context.json"
          jq -e '.freshness == "current"
            and .evidence.packet.abstention == null
            and (.evidence.packet.evidence | type == "array")
            and (.evidence.packet.evidence | length) > 0' "$RUNNER_TEMP/native-context.json"

  attest-main-gate:
    name: Attest exact-SHA green main gate
    if: >-
      needs.classify.outputs.full == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - classify
      - quality
      - windows-portability
      - macos-portability
      - linux-release-portability
      - rocksdb
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Write exact-SHA gate manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-attestation
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schemaVersion: 1,
              repository: $repository,
              sha: $sha,
              ref: $ref,
              workflowRef: $workflowRef,
              eventName: $eventName,
              runId: $runId,
              runAttempt: $runAttempt,
              requiredJobs: [
                "quality",
                "windows-portability",
                "macos-portability",
                "linux-release-portability",
                "rocksdb/database",
                "rocksdb/runtime",
                "rocksdb/operations"
              ]
            }' >gate-attestation/v2-main-gate.json
          jq -e \
            '.ref == "refs/heads/main" and (.sha | test("^[0-9a-f]{40}$"))' \
            gate-attestation/v2-main-gate.json >/dev/null

      - name: Attest exact-SHA gate manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: gate-attestation/v2-main-gate.json

      - name: Upload exact-SHA gate manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v2-main-gate-${{ github.sha }}
          path: gate-attestation/v2-main-gate.json
          if-no-files-found: error
          retention-days: 90
