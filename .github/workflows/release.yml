# Cartograph v2 tag-only release pipeline. The complete live suite runs once on
# the exact published main SHA in v2-rust.yml and emits a GitHub-attested gate
# manifest. This workflow verifies that immutable evidence, then performs only
# the four release-specific native builds, archive audits, provenance, and
# publication.
# PostgreSQL, ParadeDB, and pgvector are external runtime services and are never
# bundled in these archives.
name: release

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-main-gate:
    name: Verify exact-SHA green main evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release candidate is the published main head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$GITHUB_SHA" != "$MAIN_SHA" ]]; then
            echo "Release candidate must be the published main head ($MAIN_SHA), not $GITHUB_SHA" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$(
              sed -n '/^\[workspace\.package\]$/,/^\[/ {
                s/^version = "\([^"]*\)"$/\1/p
              }' Cargo.toml | head -n 1
            )"
            if [[ -z "$VERSION" || "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "Release tag $GITHUB_REF_NAME does not match the workspace version v$VERSION" >&2
              exit 1
            fi
            TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Release tag resolves to $TAG_SHA, not workflow SHA $GITHUB_SHA" >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Manual release validation must run from main.' >&2
            exit 1
          fi

      - name: Resolve successful exact-SHA main gate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/v2-rust.yml/runs?branch=main&status=completed&per_page=100"
          )"
          run_id="$(
            jq -r --arg sha "$GITHUB_SHA" '
              [
                .workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .head_branch == "main"
                    and (.event == "push" or .event == "workflow_dispatch")
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.run_number, .run_attempt)
              | last
              | .id // empty
            ' <<<"$runs"
          )"
          if [[ -z "$run_id" ]]; then
            echo "No successful v2 Rust main gate exists for exact SHA $GITHUB_SHA" >&2
            exit 1
          fi
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          echo "Using exact-SHA main gate run $run_id"

      - name: Download exact-SHA gate manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v2-main-gate-${{ github.sha }}
          path: gate-attestation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.run_id }}

      - name: Verify gate provenance and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          manifest='gate-attestation/v2-main-gate.json'
          gh attestation verify "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/v2-rust.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners >/dev/null
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --argjson runId "$GATE_RUN_ID" '
              .schemaVersion == 1
              and .repository == $repository
              and .sha == $sha
              and .ref == "refs/heads/main"
              and (.eventName == "push" or .eventName == "workflow_dispatch")
              and .runId == $runId
              and .requiredJobs == [
                "quality",
                "windows-portability",
                "macos-portability",
                "linux-release-portability",
                "paradedb/database",
                "paradedb/runtime",
                "paradedb/operations"
              ]
            ' "$manifest" >/dev/null
          echo "Verified exact-SHA green main evidence from run $GATE_RUN_ID"

  build:
    needs: verify-main-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            asset_target: linux-x64
            shell: bash
            cache_key: unused-linux-x64
            build_image: rust:1.98.1-trixie@sha256:af753e6e729c839de28010e323abc550eceaa9572bdaa765429d4f585e2e43dc
            runtime_image: debian:13-slim@sha256:abc9cb88a5587630d7f915f47b23b0668fe250fbfc6457aa4d52b534c1bbf73f
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            asset_target: linux-arm64
            shell: bash
            cache_key: unused-linux-arm64
            build_image: rust:1.98.1-trixie@sha256:f4afe6d7edbfd62fbb0d090ba65ca5202c5bfa97ed650f5dfba1500dc1ec035c
            runtime_image: debian:13-slim@sha256:7215f78f35ffe58fe13f244fac9c4f21326d55187271fbb3e1a8aa5cc7e387ab
          - os: macos-26
            rust_target: aarch64-apple-darwin
            asset_target: darwin-arm64
            shell: bash
            cache_key: release-darwin-arm64
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            asset_target: windows-x64
            shell: pwsh
            cache_key: release-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust toolchain
        if: ${{ !startsWith(matrix.asset_target, 'linux-') }}
        run: rustup show active-toolchain

      - name: Install release target
        if: ${{ !startsWith(matrix.asset_target, 'linux-') }}
        run: rustup target add ${{ matrix.rust_target }}

      - name: Restore Rust dependency cache
        if: ${{ !startsWith(matrix.asset_target, 'linux-') }}
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cartograph-rust-${{ runner.os }}-${{ matrix.cache_key }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cartograph-rust-${{ runner.os }}-${{ matrix.cache_key }}-

      - name: Build, audit, and smoke Unix archive
        if: matrix.shell == 'bash' && !startsWith(matrix.asset_target, 'linux-')
        shell: bash
        run: scripts/build-rust-release.sh '${{ matrix.rust_target }}' '${{ matrix.asset_target }}'

      - name: Build and smoke Linux archive on current stable glibc 2.41
        if: startsWith(matrix.asset_target, 'linux-')
        shell: bash
        run: >-
          scripts/build-linux-rust-release.sh
          '${{ matrix.rust_target }}'
          '${{ matrix.asset_target }}'
          '${{ matrix.build_image }}'
          '${{ matrix.runtime_image }}'

      - name: Build, audit, and smoke Windows archive
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: scripts/build-rust-release.ps1 -Target '${{ matrix.rust_target }}' -AssetTarget '${{ matrix.asset_target }}'

      - name: Save Rust dependency cache
        if: ${{ !startsWith(matrix.asset_target, 'linux-') && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.asset_target }}
          path: release/cartograph-*
          if-no-files-found: error

  publish:
    needs:
      - verify-main-gate
      - build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Stage and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find release-artifacts -type f -name 'cartograph-*' -exec cp {} release/ \;
          expected=$'cartograph-darwin-arm64\ncartograph-darwin-arm64.tar.gz\ncartograph-linux-arm64\ncartograph-linux-arm64.tar.gz\ncartograph-linux-x64\ncartograph-linux-x64.tar.gz\ncartograph-windows-x64.exe\ncartograph-windows-x64.zip'
          actual="$(find release -maxdepth 1 -type f -name 'cartograph-*' -exec basename {} \; | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'release asset set mismatch' >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") >&2 || true
            exit 1
          fi
          (cd release && sha256sum cartograph-* > SHA256SUMS)
          ls -lh release

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cartograph-cli") | .version')"
          EXPECTED_TAG="v$VERSION"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $TAG does not match Cargo version $EXPECTED_TAG" >&2
            exit 1
          fi
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "Release tag $TAG resolves to $TAG_SHA, but this workflow built $GITHUB_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$TAG_SHA" != "$MAIN_SHA" ]]; then
            echo "Release tag must point at the published main head ($MAIN_SHA), not $TAG_SHA" >&2
            exit 1
          fi
          NOTES="docs/releases/$TAG.md"
          if [[ ! -f "$NOTES" || ! -s "$NOTES" ]]; then
            echo "Tracked release notes are required at $NOTES" >&2
            exit 1
          fi
          if ! grep -Fq "# Cartograph $TAG" "$NOTES"; then
            echo "Release notes at $NOTES do not identify $TAG" >&2
            exit 1
          fi
          if grep -Eiq '(^|[[:space:][:punct:]])(TBD|TODO|PLACEHOLDER)($|[[:space:][:punct:]])' "$NOTES"; then
            echo "Release notes at $NOTES still contain placeholder text" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$IS_DRAFT" != true ]]; then
              echo "Refusing to replace assets on published release $TAG" >&2
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file "$NOTES" --draft
          fi
          gh release upload "$TAG" release/cartograph-* release/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
